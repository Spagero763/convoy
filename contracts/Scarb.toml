[package]
name = "convoy"
version = "0.1.0"
edition = "2024_07"
license = "Apache-2.0"
description = "Fixed-lot batch execution venue for the STRK20 privacy pool"

[dependencies]
starknet = "2.20.0"

[dev-dependencies]
snforge_std = "0.63.0"
assert_macros = "2.20.0"

[lib]

[[target.starknet-contract]]
sierra = true
casm = true

[scripts]
test = "snforge test"

[tool.fmt]
sort-module-level-items = true

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

# Declaring a class is priced almost entirely on the size of the Sierra the
# sequencer has to compile, so the release profile strips debug identifiers and
# leaves inlining alone. This is the artifact that gets declared.
[profile.release.cairo]
sierra-replace-ids = false
unstable-add-statements-functions-debug-info = false
unstable-add-statements-code-locations-debug-info = false
