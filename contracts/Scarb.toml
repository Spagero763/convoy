[package]
name = "convoy"
version = "0.1.0"
edition = "2024_07"
license = "Apache-2.0"
description = "Fixed-lot batch execution venue for the STRK20 privacy pool"

[dependencies]
starknet = "2.20.0"

[dev-dependencies]
snforge_std = "0.63.0"
assert_macros = "2.20.0"

[lib]

[[target.starknet-contract]]
sierra = true
casm = true

[scripts]
test = "snforge test"

[tool.fmt]
sort-module-level-items = true

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[profile.release.cairo]
inlining-strategy = "default"
